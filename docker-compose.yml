services:
  mcp-server:
    build:
      context: ./src
    command: python -m mcp_server.main
    ports:
      - "${MCP_PORT:-8200}:${MCP_PORT:-8200}"
    environment:
      LOCAL: "true"
      CLI_PROVIDER: ${CLI_PROVIDER:-claude}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CLI_DEFAULT_MODEL: ${CLAUDE_CLI_DEFAULT_MODEL:-}
      DEVIN_MODEL: ${DEVIN_MODEL:-}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-service-catalog}
      REDIS_URL: redis://redis:6379
      MCP_PORT: ${MCP_PORT:-8200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-service-catalog}
    volumes:
      # Devin CLI: mount host credentials so auth persists across restarts.
      # Run `devin auth login --force-manual-token-flow` on your host first.
      # - ~/.local/share/devin/credentials.toml:/root/.local/share/devin/credentials.toml:ro
      - batch-workspaces:/var/batch-workspaces
      - repo-clones:/repos
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  # Optional: GitHub webhook receiver + automatic repo indexing on push.
  # Only needed if you want repos to be re-indexed automatically on git push.
  # Expose port 80 publicly (e.g. via a reverse proxy) and register your
  # GitHub App webhook to point at it.
  #
  # api:
  #   build:
  #     context: ./src
  #   command: uvicorn api.main:app --host 0.0.0.0 --port 80
  #   ports:
  #     - "80:80"
  #   environment:
  #     GITHUB_APP_ID: ${GITHUB_APP_ID}
  #     GITHUB_APP_NAME: ${GITHUB_APP_NAME}
  #     GITHUB_PRIVATE_KEY_PATH: /data/service-catalog.pem
  #     MONGODB_URI: mongodb://mongodb:27017
  #     MONGODB_DATABASE: ${MONGODB_DATABASE:-service-catalog}
  #     REDIS_URL: redis://redis:6379
  #     STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  #     STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  #   volumes:
  #     - /path/to/service-catalog.pem:/data/service-catalog.pem:ro
  #     - repo-clones:/repos
  #   depends_on:
  #     - mongodb
  #     - redis
  #   restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  batch-workspaces:   # Ephemeral batch change workspaces (wiped on cancel_batch)
  repo-clones:        # Indexer repo clones (persistent across restarts)
  mongo-data:         # Repository index (MongoDB)
  redis-data:         # Batch session cache (Redis)
